<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>binary2graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #222;
  }
  #header {
    flex: none;
    padding: 8px 12px;
    border-bottom: 1px solid #ccc;
    background: #f5f5f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #header .path {
    font-weight: 600;
  }
  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #cy-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  #cy {
    position: absolute;
    inset: 0;
  }
  #controls {
    position: absolute;
    top: 8px;
    left: 8px;
    display: flex;
    gap: 4px;
  }
  #controls button {
    min-width: 26px;
    height: 26px;
    padding: 0 6px;
    border: 1px solid #ccc;
    background: #fff;
    font: inherit;
    line-height: 1;
    color: #222;
    cursor: pointer;
  }
  #controls button:hover {
    background: #eee;
  }
  #status {
    padding-left: 6px;
    line-height: 26px;
    color: #a00;
  }
  #panel {
    flex: none;
    width: 260px;
    padding: 10px 12px;
    border-left: 1px solid #ccc;
    background: #fafafa;
    overflow-y: auto;
  }
  #panel input {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
    padding: 3px 6px;
    border: 1px solid #ccc;
    font: inherit;
    font-family: monospace;
  }
  #panel .muted {
    color: #666;
  }
  #roots summary {
    margin-top: 12px;
    color: #666;
    cursor: pointer;
  }
  #node {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
  }
  #panel h2 {
    margin: 0 0 8px;
    font-size: 13px;
    font-family: monospace;
    word-break: break-all;
  }
  #panel h3 {
    margin: 12px 0 4px;
    font-size: 12px;
    color: #666;
  }
  #panel dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    margin: 0;
  }
  #panel dt {
    color: #666;
  }
  #panel dd {
    margin: 0;
    font-family: monospace;
  }
  #panel ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  #panel button {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-family: monospace;
    color: #0645ad;
    text-align: left;
    cursor: pointer;
  }
  #panel button:hover {
    text-decoration: underline;
  }
  #panel .hint {
    margin: 0;
    color: #666;
  }
</style>
</head>
<body>
<div id="header"></div>
<div id="main">
  <div id="cy-wrap">
    <div id="cy"></div>
    <div id="controls">
      <button id="zoom-in" title="zoom in (+)">+</button>
      <button id="zoom-out" title="zoom out (-)">-</button>
      <button id="zoom-fit" title="fit the whole graph (0)">fit</button>
      <span id="status"></span>
    </div>
  </div>
  <div id="panel">
    <input id="search" type="search" placeholder="find function" autocomplete="off" spellcheck="false">
    <ul id="results"></ul>
    <details id="roots" open>
      <summary>roots</summary>
    </details>
    <div id="node"></div>
  </div>
</div>
<script>
const KINDS = {
  Local: { color: "#a8d5ff", shape: "ellipse" },
  Plt: { color: "#ffcc99", shape: "rectangle" },
  Unknown: { color: "#dddddd", shape: "ellipse" },
};
// Past this many nodes the page starts from one seed instead of drawing the whole graph.
const FULL_GRAPH_LIMIT = 300;
const BUDGET = 200;
const SEARCH_LIMIT = 50;
const TOP_ROOTS = 10;

let nodes = [];
let nodeIndex = new Map();
let functions = new Map();
let functionList = [];
let entryPoint = 0;
let callers = [];
let callees = [];
let inDeg = [];
let outDeg = [];
let fullGraph = false;
let cy = null;

fetch("/api/report")
  .then((r) => r.json())
  .then(init)
  .catch(() => {
    document.getElementById("header").textContent = "can't load report";
  });

function init(report) {
  nodes = report.graph.nodes;
  nodeIndex = new Map(nodes.map((n, i) => [n.name, i]));
  functionList = report.functions;
  functions = new Map(functionList.map((f) => [f.name, f]));
  entryPoint = report.info.entry_point;
  indexEdges(report.graph.edges);
  renderHeader(report);
  createGraph();
  bindSearch();
  getRoots().then(renderRoots);
  reset();
  if (nodes.length === 0) {
    return;
  }
  fullGraph = nodes.length <= FULL_GRAPH_LIMIT;
  if (fullGraph) {
    showAll();
  } else {
    showSeed(defaultSeed());
  }
}

// In/out counts and caller/callee lists come from the edge list, not from the function metrics.
function indexEdges(edges) {
  inDeg = nodes.map(() => 0);
  outDeg = nodes.map(() => 0);
  callers = nodes.map(() => new Set());
  callees = nodes.map(() => new Set());
  for (const [source, target] of edges) {
    outDeg[source] += 1;
    inDeg[target] += 1;
    callees[source].add(target);
    callers[target].add(source);
  }
}

// The ELF entry point only calls __libc_start_main, so main is the better start when present.
function defaultSeed() {
  if (nodeIndex.has("main")) {
    return nodeIndex.get("main");
  }
  const entry = entryNode();
  return entry === null ? outDeg.indexOf(Math.max(...outDeg)) : entry;
}

function entryNode() {
  const entry = functionList.find((f) => f.address === entryPoint);
  return entry && nodeIndex.has(entry.name) ? nodeIndex.get(entry.name) : null;
}

// Search and roots go through these two so the source can move to the server without touching the UI.
function searchNames(query) {
  const needle = query.toLowerCase();
  const matches = [];
  if (needle === "") {
    return Promise.resolve({ matches, total: 0 });
  }
  for (const f of functionList) {
    const at = f.name.toLowerCase().indexOf(needle);
    if (at >= 0) {
      const id = nodeIndex.has(f.name) ? nodeIndex.get(f.name) : null;
      matches.push({ name: f.name, kind: "Local", id, address: f.address, at });
    }
  }
  nodes.forEach((n, id) => {
    const at = n.name.toLowerCase().indexOf(needle);
    if (at >= 0 && n.kind !== "Local") {
      matches.push({ name: n.name, kind: n.kind, id, address: null, at });
    }
  });
  matches.sort((a, b) => a.at - b.at || a.name.localeCompare(b.name));
  return Promise.resolve({ matches: matches.slice(0, SEARCH_LIMIT), total: matches.length });
}

function getRoots() {
  const entry = entryNode();
  const exported = functionList
    .filter((f) => f.exported && nodeIndex.has(f.name))
    .map((f) => nodeIndex.get(f.name));
  const top = nodes
    .map((n, id) => id)
    .filter((id) => nodes[id].kind === "Local" && inDeg[id] > 0)
    .sort((a, b) => inDeg[b] - inDeg[a] || a - b)
    .slice(0, TOP_ROOTS);
  return Promise.resolve({ entry: entry === null ? [] : [entry], exported, top });
}

function renderRoots(roots) {
  const box = document.getElementById("roots");
  box.replaceChildren(el("summary", "roots"));
  addList(box, "entry point", roots.entry, showSeed);
  addList(box, "exported", roots.exported, showSeed);
  addList(box, "most called", roots.top, showSeed);
}

function bindSearch() {
  const input = document.getElementById("search");
  let pending = null;
  input.addEventListener("input", () => {
    clearTimeout(pending);
    pending = setTimeout(() => searchNames(input.value.trim()).then(renderResults), 150);
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      const first = document.querySelector("#results button");
      if (first) {
        first.click();
      }
    }
  });
}

function renderResults(result) {
  const list = document.getElementById("results");
  list.replaceChildren();
  for (const match of result.matches) {
    const button = el("button", match.name);
    if (match.id === null) {
      button.addEventListener("click", () => showFunction(match.name));
    } else {
      button.addEventListener("click", () => showSeed(match.id));
    }
    const item = el("li");
    item.append(button);
    if (match.kind !== "Local") {
      item.append(" ", muted(match.kind.toLowerCase()));
    } else if (match.id === null) {
      item.append(" ", muted("no calls"));
    }
    list.append(item);
  }
  if (result.total > result.matches.length) {
    const more = el("li");
    more.append(muted(result.matches.length + " of " + result.total + " shown"));
    list.append(more);
  }
}

function muted(text) {
  const span = el("span", text);
  span.className = "muted";
  return span;
}

// A function without a node never made or received a direct call, so there is nothing to draw.
function showFunction(name) {
  const fn = functions.get(name);
  const rows = document.createElement("dl");
  addRow(rows, "address", "0x" + fn.address.toString(16));
  addRow(rows, "size", String(fn.size));
  addRow(rows, "instructions", String(fn.instructions));
  const hint = el("p", "no direct calls in or out");
  hint.className = "hint";
  document.getElementById("node").replaceChildren(el("h2", name), rows, hint);
}

function renderHeader(report) {
  const info = report.info;
  const rest = [info.architecture, info.kind, info.stripped ? "stripped" : "not stripped"];
  const names = info.instrumentation.map((d) => d.name);
  if (names.length) {
    rest.push(names.join(", "));
  }
  const path = el("span", report.binary);
  path.className = "path";
  const header = document.getElementById("header");
  header.replaceChildren(path, document.createTextNode("  ·  " + rest.join("  ·  ")));
}

function createGraph() {
  cy = cytoscape({
    container: document.getElementById("cy"),
    // dragging a node would pull it out of the layout, so pan instead
    autoungrabify: true,
    wheelSensitivity: 0.2,
    minZoom: 0.05,
    maxZoom: 4,
    style: [
      {
        selector: "node",
        style: {
          "label": "data(label)",
          "background-color": "data(color)",
          "shape": "data(shape)",
          "border-width": 1,
          "border-color": "#555",
          "width": "label",
          "height": "label",
          "padding": "8px",
          "font-size": 10,
          "font-family": "monospace",
          "text-valign": "center",
          "text-halign": "center",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1,
          "line-color": "#888",
          "target-arrow-color": "#888",
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
        },
      },
      { selector: ".active", style: { "border-width": 3, "border-color": "#333" } },
    ],
  });

  bindControls();
  cy.on("tap", "node", (event) => select(Number(event.target.id()), false));
  cy.on("tap", (event) => {
    if (event.target === cy) {
      reset();
    }
  });
}

function bindControls() {
  document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.3));
  document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.3));
  document.getElementById("zoom-fit").addEventListener("click", fit);
  document.addEventListener("keydown", (event) => {
    if (event.target.tagName === "INPUT") {
      return;
    }
    if (event.key === "+" || event.key === "=") {
      zoomBy(1.3);
    } else if (event.key === "-") {
      zoomBy(1 / 1.3);
    } else if (event.key === "0") {
      fit();
    }
  });
}

// Zoom around the middle of the viewport, the way the buttons and keys imply.
function zoomBy(factor) {
  cy.zoom({
    level: cy.zoom() * factor,
    renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 },
  });
}

function fit() {
  cy.fit(undefined, 20);
}

function showAll() {
  const all = nodes.map((_, id) => ({ id, hasMore: false }));
  const edges = [];
  callees.forEach((targets, source) => {
    for (const target of targets) {
      edges.push([source, target]);
    }
  });
  merge({ nodes: all, edges, truncated: false });
  layout();
}

function showSeed(index) {
  if (fullGraph) {
    select(index, true);
    return;
  }
  cy.elements().remove();
  expand(index).then(() => {
    fit();
    highlight(index);
    renderPanel(index);
  });
}

// Recentre only when the node was picked from the panel, where it may be off screen.
function select(index, center) {
  expand(index).then(() => {
    highlight(index);
    if (center) {
      cy.center(cy.getElementById(String(index)));
    }
    renderPanel(index);
  });
}

function expand(index) {
  return getNeighbors(index, 1, "both", BUDGET).then((result) => {
    const added = merge(result);
    const name = nodes[index].name;
    setStatus(result.truncated ? "neighbourhood of " + name + " cut at " + BUDGET + " nodes" : "");
    if (added.length) {
      layout();
    }
  });
}

// Every neighbour lookup goes through here so the source can move to the server without touching the UI.
function getNeighbors(seed, depth, dir, budget) {
  return Promise.resolve(neighborhood(seed, depth, dir, budget));
}

function neighborhood(seed, depth, dir, budget) {
  const visited = new Set([seed]);
  let frontier = [seed];
  let truncated = false;
  for (let level = 0; level < depth && frontier.length && !truncated; level++) {
    const next = [];
    for (const index of frontier) {
      for (const neighbor of adjacent(index, dir)) {
        if (visited.has(neighbor)) {
          continue;
        }
        if (visited.size >= budget) {
          truncated = true;
          break;
        }
        visited.add(neighbor);
        next.push(neighbor);
      }
      if (truncated) {
        break;
      }
    }
    frontier = next;
  }

  // Edges to nodes outside the visited set are left out: the "+" marker stands in for them.
  const edges = [];
  for (const source of visited) {
    for (const target of callees[source]) {
      if (visited.has(target)) {
        edges.push([source, target]);
      }
    }
  }
  const result = [...visited].map((id) => ({
    id,
    hasMore: [...adjacent(id, "both")].some((n) => !visited.has(n)),
  }));
  return { nodes: result, edges, truncated };
}

function adjacent(index, dir) {
  if (dir === "out") {
    return callees[index];
  }
  if (dir === "in") {
    return callers[index];
  }
  return new Set([...callers[index], ...callees[index]]);
}

function merge(result) {
  const fresh = [];
  const freshNodes = [];
  for (const { id, hasMore } of result.nodes) {
    const existing = cy.getElementById(String(id));
    if (existing.nonempty()) {
      // A node keeps its marker until one lookup has brought in all of its neighbours.
      if (!hasMore) {
        setMore(existing, false);
      }
      continue;
    }
    const node = nodes[id];
    const style = KINDS[node.kind] || KINDS.Unknown;
    fresh.push({ id, hasMore });
    freshNodes.push({
      group: "nodes",
      data: { id: String(id), name: node.name, color: style.color, shape: style.shape },
    });
  }
  const added = cy.add(freshNodes);
  for (const { id, hasMore } of fresh) {
    setMore(cy.getElementById(String(id)), hasMore);
  }

  const freshEdges = [];
  for (const [source, target] of result.edges) {
    const id = source + "-" + target;
    if (cy.getElementById(id).empty()) {
      freshEdges.push({
        group: "edges",
        data: { id, source: String(source), target: String(target) },
      });
    }
  }
  return added.union(cy.add(freshEdges));
}

function setMore(node, more) {
  node.data("more", more);
  node.data("label", more ? node.data("name") + " +" : node.data("name"));
}

function layout() {
  cy.layout({ name: "breadthfirst", directed: true, spacingFactor: 0.8, padding: 20 }).run();
}

function highlight(index) {
  cy.nodes().removeClass("active");
  cy.getElementById(String(index)).addClass("active");
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function reset() {
  cy.nodes().removeClass("active");
  const hint = el("p", "click a node to expand it");
  hint.className = "hint";
  document.getElementById("node").replaceChildren(hint);
}

function renderPanel(index) {
  const node = nodes[index];
  // Plt and unknown nodes have no function entry, so their metrics are left out.
  const fn = functions.get(node.name);
  const rows = document.createElement("dl");
  addRow(rows, "kind", node.kind);
  if (fn) {
    addRow(rows, "address", "0x" + fn.address.toString(16));
    addRow(rows, "size", String(fn.size));
    addRow(rows, "instructions", String(fn.instructions));
  }
  addRow(rows, "in", String(inDeg[index]));
  addRow(rows, "out", String(outDeg[index]));

  const box = document.getElementById("node");
  box.replaceChildren(el("h2", node.name), rows);
  const scene = cy.getElementById(String(index));
  addList(box, "callers", sceneIds(scene.incomers("node")), (id) => select(id, true));
  addList(box, "callees", sceneIds(scene.outgoers("node")), (id) => select(id, true));
  box.scrollIntoView();
}

function sceneIds(collection) {
  return collection.map((n) => Number(n.id())).sort(byName);
}

function byName(a, b) {
  return nodes[a].name.localeCompare(nodes[b].name);
}

function addRow(rows, name, value) {
  rows.append(el("dt", name), el("dd", value));
}

function addList(box, title, indexes, pick) {
  if (indexes.length === 0) {
    return;
  }
  const list = el("ul");
  for (const index of indexes) {
    const button = el("button", nodes[index].name);
    button.addEventListener("click", () => pick(index));
    const item = el("li");
    item.append(button);
    list.append(item);
  }
  box.append(el("h3", title), list);
}

function el(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
</script>
</body>
</html>
