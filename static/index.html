<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>binary2graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.js"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #222;
  }
  #header {
    flex: none;
    padding: 8px 12px;
    border-bottom: 1px solid #ccc;
    background: #f5f5f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #header .path {
    font-weight: 600;
  }
  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #cy-wrap {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-width: 0;
  }
  #cy {
    flex: 1;
    min-height: 0;
  }
  #controls {
    flex: none;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    border-bottom: 1px solid #ddd;
  }
  #controls button {
    min-width: 26px;
    height: 26px;
    padding: 0 6px;
    border: 1px solid #ccc;
    background: #fff;
    font: inherit;
    line-height: 1;
    color: #222;
    cursor: pointer;
  }
  #controls button:hover {
    background: #eee;
  }
  #controls label {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 26px;
    padding: 0 6px;
    border: 1px solid #ccc;
    background: #fff;
    box-sizing: border-box;
  }
  #controls input[type="number"] {
    width: 3em;
    font: inherit;
  }
  #controls button:disabled {
    color: #999;
    cursor: default;
  }
  #trail {
    display: flex;
    align-items: center;
    gap: 4px;
    padding-left: 6px;
    font-family: monospace;
  }
  #trail button {
    min-width: 0;
    height: auto;
    padding: 0;
    border: 0;
    background: none;
    font-family: monospace;
    color: #0645ad;
  }
  #trail button:hover {
    background: none;
    text-decoration: underline;
  }
  #status {
    padding-left: 6px;
    line-height: 26px;
    color: #a00;
  }
  #panel {
    flex: none;
    width: 260px;
    padding: 10px 12px;
    border-left: 1px solid #ccc;
    background: #fafafa;
    overflow-y: auto;
  }
  #panel input,
  #panel textarea,
  #panel select {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 8px;
    padding: 3px 6px;
    border: 1px solid #ccc;
    font: inherit;
    font-family: monospace;
  }
  #panel textarea {
    resize: vertical;
  }
  #panel .muted {
    color: #666;
  }
  #roots summary,
  #run summary {
    margin-top: 12px;
    color: #666;
    cursor: pointer;
  }
  #panel #run-button {
    padding: 3px 10px;
    border: 1px solid #ccc;
    background: #fff;
    font-family: inherit;
    color: #222;
  }
  #panel #run-button:hover {
    background: #eee;
    text-decoration: none;
  }
  #panel #run-button:disabled {
    color: #999;
    cursor: default;
  }
  #run-status {
    margin-top: 6px;
  }
  #run-status.error {
    color: #a00;
  }
  #run pre {
    max-height: 10em;
    overflow: auto;
    margin: 0;
    padding: 4px 6px;
    border: 1px solid #ddd;
    background: #fff;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-all;
  }
  #node {
    margin-top: 12px;
    padding-top: 8px;
    border-top: 1px solid #ddd;
  }
  #panel h2 {
    margin: 0 0 8px;
    font-size: 13px;
    font-family: monospace;
    word-break: break-all;
  }
  #panel h3 {
    margin: 12px 0 4px;
    font-size: 12px;
    color: #666;
  }
  #panel dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    margin: 0;
  }
  #panel dt {
    color: #666;
  }
  #panel dd {
    margin: 0;
    font-family: monospace;
  }
  #panel ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  #panel button {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-family: monospace;
    color: #0645ad;
    text-align: left;
    cursor: pointer;
  }
  #panel button:hover {
    text-decoration: underline;
  }
  #panel .hint {
    margin: 0;
    color: #666;
  }
</style>
</head>
<body>
<div id="header"></div>
<div id="main">
  <div id="cy-wrap">
    <div id="controls">
      <button id="zoom-in" title="zoom in (+)">+</button>
      <button id="zoom-out" title="zoom out (-)">-</button>
      <button id="zoom-fit" title="fit the scene (0)">fit</button>
      <button id="relayout" title="lay the scene out again">layout</button>
      <button id="back" title="previous seed" disabled>back</button>
      <label><input type="checkbox" id="hide-plt"> hide plt</label>
      <label><input type="checkbox" id="collapse"> collapse external</label>
      <label>min degree <input type="number" id="min-degree" min="0" value="0"></label>
      <label><input type="checkbox" id="show-trace" checked disabled> trace</label>
      <label><input type="checkbox" id="only-executed" disabled> only executed</label>
      <span id="trail"></span>
      <span id="status"></span>
    </div>
    <div id="cy"></div>
  </div>
  <div id="panel">
    <input id="search" type="search" placeholder="find function" autocomplete="off" spellcheck="false">
    <ul id="results"></ul>
    <details id="roots" open>
      <summary>roots</summary>
    </details>
    <details id="run" open>
      <summary>run</summary>
      <select id="engine">
        <option value="ptrace">ptrace</option>
        <option value="valgrind">valgrind</option>
      </select>
      <textarea id="stdin" rows="3" placeholder="stdin" spellcheck="false"></textarea>
      <input id="args" placeholder="arguments, @@ is the input file" autocomplete="off" spellcheck="false">
      <input type="file" id="input-file">
      <button id="run-button">run</button>
      <p id="run-status" class="hint"></p>
      <h3 id="stdout-title" hidden>stdout</h3>
      <pre id="stdout" hidden></pre>
      <h3 id="stderr-title" hidden>stderr</h3>
      <pre id="stderr" hidden></pre>
    </details>
    <div id="node"></div>
  </div>
</div>
<script>
const KINDS = {
  Local: { color: "#a8d5ff", shape: "ellipse" },
  Plt: { color: "#ffcc99", shape: "rectangle" },
  Unknown: { color: "#dddddd", shape: "ellipse" },
};
// Past this many nodes the page starts from one seed instead of drawing the whole graph.
const FULL_GRAPH_LIMIT = 300;
// A hub such as a sanitizer check can have thousands of callers; one click brings in this many.
const BUDGET = 200;
// Cytoscape stays fluid at a few hundred nodes, so expansion stops here and the status says so.
const SCENE_LIMIT = 500;
const DAGRE = { name: "dagre", rankDir: "TB", nodeSep: 20, rankSep: 50, fit: false };
// A wide rank wraps into lines of this many nodes, or one hub would stretch the scene into a strip.
const PER_LINE = 12;

let nodes = [];
let nodeIndex = new Map();
let functions = new Map();
let functionList = [];
let entryPoint = 0;
let inDeg = [];
let outDeg = [];
let fullGraph = false;
let seed = null;
let history = [];
const filters = { hidePlt: false, collapse: false, minDegree: 0, onlyExecuted: false };
let trace = null;
let showTrace = true;
let cy = null;

api("/api/meta")
  .then(init)
  .catch(() => {
    document.getElementById("header").textContent = "can't load report";
  });

function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  };
  return fetch(path, options).then((r) => {
    if (!r.ok) {
      return r.text().then((text) => {
        throw new Error(text || r.statusText);
      });
    }
    return r.json();
  });
}

// Meta lists every node with its degrees but no edges; those only arrive per neighbourhood.
function init(meta) {
  nodes = meta.nodes;
  nodeIndex = new Map(nodes.map((n, i) => [n.name, i]));
  inDeg = nodes.map((n) => n.in_degree);
  outDeg = nodes.map((n) => n.out_degree);
  functionList = meta.functions;
  functions = new Map(functionList.map((f) => [f.name, f]));
  entryPoint = meta.info.entry_point;
  renderHeader(meta);
  createGraph();
  bindSearch();
  bindRun();
  getRoots().then(renderRoots);
  reset();
  if (nodes.length === 0) {
    return;
  }
  fullGraph = nodes.length <= FULL_GRAPH_LIMIT;
  if (fullGraph) {
    showAll();
  } else {
    showSeed(defaultSeed());
  }
}

// The ELF entry point only calls __libc_start_main, so main is the better start when present.
function defaultSeed() {
  if (nodeIndex.has("main")) {
    return nodeIndex.get("main");
  }
  const entry = entryNode();
  return entry === null ? outDeg.indexOf(Math.max(...outDeg)) : entry;
}

function entryNode() {
  const entry = functionList.find((f) => f.address === entryPoint);
  return entry && nodeIndex.has(entry.name) ? nodeIndex.get(entry.name) : null;
}

function searchNames(query) {
  if (query === "") {
    return Promise.resolve({ matches: [], total: 0 });
  }
  return api("/api/search?q=" + encodeURIComponent(query));
}

function getRoots() {
  return api("/api/roots");
}

function renderRoots(roots) {
  const box = document.getElementById("roots");
  box.replaceChildren(el("summary", "roots"));
  addList(box, "entry point", roots.entry, showSeed);
  addList(box, "exported", roots.exported, showSeed);
  addList(box, "most called", roots.top, showSeed);
}

function bindSearch() {
  const input = document.getElementById("search");
  let pending = null;
  input.addEventListener("input", () => {
    clearTimeout(pending);
    pending = setTimeout(() => searchNames(input.value.trim()).then(renderResults), 150);
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      const first = document.querySelector("#results button");
      if (first) {
        first.click();
      }
    }
  });
}

function renderResults(result) {
  const list = document.getElementById("results");
  list.replaceChildren();
  for (const match of result.matches) {
    const button = el("button", match.name);
    if (match.id === null) {
      button.addEventListener("click", () => showFunction(match.name));
    } else {
      button.addEventListener("click", () => showSeed(match.id));
    }
    const item = el("li");
    item.append(button);
    if (match.kind !== "Local") {
      item.append(" ", muted(match.kind.toLowerCase()));
    } else if (match.id === null) {
      item.append(" ", muted("no calls"));
    }
    list.append(item);
  }
  if (result.total > result.matches.length) {
    const more = el("li");
    more.append(muted(result.matches.length + " of " + result.total + " shown"));
    list.append(more);
  }
}

function muted(text) {
  const span = el("span", text);
  span.className = "muted";
  return span;
}

function bindRun() {
  document.getElementById("run-button").addEventListener("click", startRun);
}

function startRun() {
  const request = {
    engine: document.getElementById("engine").value,
    stdin: document.getElementById("stdin").value || null,
    args: document.getElementById("args").value.split(/\s+/).filter(Boolean),
  };
  const button = document.getElementById("run-button");
  button.disabled = true;
  setRunStatus("running", false);
  readFile(document.getElementById("input-file").files[0])
    .then((encoded) => {
      request.input_file = encoded;
      return api("/api/run", request);
    })
    .then(showRun)
    .catch((error) => setRunStatus(error.message, true))
    .finally(() => {
      button.disabled = false;
    });
}

// A data URL starts with the type of the file; the server only wants the base64 after the comma.
function readFile(file) {
  if (!file) {
    return Promise.resolve(null);
  }
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(",") + 1));
    reader.onerror = () => reject(new Error("can't read " + file.name));
    reader.readAsDataURL(file);
  });
}

// A crashed or timed out run still reports what ran before, so the overlay is applied either way.
function showRun(result) {
  trace = {
    nodeHits: new Map(Object.entries(result.node_hits).map(([id, hits]) => [Number(id), hits])),
    edgeHits: new Map(Object.entries(result.edge_hits)),
  };
  const notes = [result.exit_code === null ? "no exit code" : "exit code " + result.exit_code];
  if (result.error !== null) {
    notes.push(result.error);
  }
  setRunStatus(notes.join("; "), result.error !== null);
  showOutput("stdout", result.stdout);
  showOutput("stderr", result.stderr);
  document.getElementById("show-trace").disabled = false;
  document.getElementById("only-executed").disabled = false;

  // The explorer scene has only what was expanded, so the trace is brought in for the filter.
  let changed = false;
  if (!fullGraph) {
    const executed = result.executed_nodes.map((id) => ({ id, hasMore: true }));
    const { added, skipped } = merge({ nodes: executed, edges: result.executed_edges, truncated: false });
    setStatus(skipped ? "scene limit of " + SCENE_LIMIT + " nodes reached, " + skipped + " left out" : "");
    changed = added.length > 0;
  }
  applyTrace();
  if (changed || filters.onlyExecuted) {
    refilter();
  }
  if (seed !== null && cy.getElementById(String(seed)).hasClass("active")) {
    renderPanel(seed);
  }
}

function setRunStatus(text, error) {
  const status = document.getElementById("run-status");
  status.textContent = text;
  status.classList.toggle("error", error);
}

function showOutput(name, text) {
  document.getElementById(name).textContent = text;
  document.getElementById(name).hidden = text === "";
  document.getElementById(name + "-title").hidden = text === "";
}

// A function without a node never made or received a direct call, so there is nothing to draw.
function showFunction(name) {
  const fn = functions.get(name);
  const rows = document.createElement("dl");
  addRow(rows, "address", "0x" + fn.address.toString(16));
  addRow(rows, "size", String(fn.size));
  addRow(rows, "instructions", String(fn.instructions));
  const hint = el("p", "no direct calls in or out");
  hint.className = "hint";
  document.getElementById("node").replaceChildren(el("h2", name), rows, hint);
}

function renderHeader(meta) {
  const info = meta.info;
  const rest = [info.architecture, info.kind, info.stripped ? "stripped" : "not stripped"];
  const names = info.instrumentation.map((d) => d.name);
  if (names.length) {
    rest.push(names.join(", "));
  }
  const path = el("span", meta.binary);
  path.className = "path";
  const header = document.getElementById("header");
  header.replaceChildren(path, document.createTextNode("  ·  " + rest.join("  ·  ")));
}

function createGraph() {
  cy = cytoscape({
    container: document.getElementById("cy"),
    // dragging a node would pull it out of the layout, so pan instead
    autoungrabify: true,
    wheelSensitivity: 0.2,
    minZoom: 0.05,
    maxZoom: 4,
    hideEdgesOnViewport: true,
    textureOnViewport: true,
    style: [
      {
        selector: "node",
        style: {
          "label": "data(label)",
          "background-color": "data(color)",
          "shape": "data(shape)",
          "border-width": 1,
          "border-color": "#555",
          "width": "label",
          "height": "label",
          "padding": "8px",
          "font-size": 10,
          "min-zoomed-font-size": 8,
          "font-family": "monospace",
          "text-valign": "center",
          "text-halign": "center",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1,
          "line-color": "#888",
          "target-arrow-color": "#888",
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
        },
      },
      { selector: "node.executed", style: { "border-width": 3, "border-color": "#2e7d32" } },
      {
        selector: "edge.executed",
        style: {
          "width": 3,
          "line-color": "#2e7d32",
          "target-arrow-color": "#2e7d32",
          "label": "data(hits)",
          "color": "#2e7d32",
          "font-size": 9,
          "min-zoomed-font-size": 8,
          "text-rotation": "autorotate",
          "text-background-color": "#fff",
          "text-background-opacity": 1,
        },
      },
      { selector: ".active", style: { "border-width": 3, "border-color": "#333" } },
      { selector: ".hidden", style: { "display": "none" } },
    ],
  });

  bindControls();
  bindFilters();
  cy.on("tap", "node", (event) => {
    if (event.target.hasClass("meta")) {
      setCollapse(false);
    } else {
      select(Number(event.target.id()), false);
    }
  });
  cy.on("tap", (event) => {
    if (event.target === cy) {
      reset();
    }
  });
}

function bindControls() {
  document.getElementById("zoom-in").addEventListener("click", () => zoomBy(1.3));
  document.getElementById("zoom-out").addEventListener("click", () => zoomBy(1 / 1.3));
  document.getElementById("zoom-fit").addEventListener("click", fit);
  document.getElementById("relayout").addEventListener("click", layout);
  document.getElementById("back").addEventListener("click", back);
  document.addEventListener("keydown", (event) => {
    if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) {
      return;
    }
    if (event.key === "+" || event.key === "=") {
      zoomBy(1.3);
    } else if (event.key === "-") {
      zoomBy(1 / 1.3);
    } else if (event.key === "0") {
      fit();
    }
  });
}

// Zoom around the middle of the viewport, the way the buttons and keys imply.
function zoomBy(factor) {
  cy.zoom({
    level: cy.zoom() * factor,
    renderedPosition: { x: cy.width() / 2, y: cy.height() / 2 },
  });
}

// A scene of a few nodes would otherwise fill the viewport with huge labels.
function fit() {
  const eles = shown();
  cy.fit(eles, 20);
  if (cy.zoom() > 1.5) {
    cy.zoom(1.5);
    cy.center(eles);
  }
}

// Cytoscape caches visibility until the next render, so the hidden class is the truth here.
function shown() {
  const visible = cy.nodes().not(".hidden");
  const edges = visible
    .connectedEdges()
    .filter((e) => !e.source().hasClass("hidden") && !e.target().hasClass("hidden"));
  return visible.union(edges);
}

function bindFilters() {
  document.getElementById("hide-plt").addEventListener("change", (event) => {
    filters.hidePlt = event.target.checked;
    refilter();
  });
  document.getElementById("collapse").addEventListener("change", (event) => {
    filters.collapse = event.target.checked;
    refilter();
  });
  document.getElementById("min-degree").addEventListener("input", (event) => {
    filters.minDegree = Number(event.target.value) || 0;
    refilter();
  });
  document.getElementById("show-trace").addEventListener("change", (event) => {
    showTrace = event.target.checked;
    applyTrace();
  });
  document.getElementById("only-executed").addEventListener("change", (event) => {
    filters.onlyExecuted = event.target.checked;
    refilter();
  });
}

function setCollapse(on) {
  document.getElementById("collapse").checked = on;
  filters.collapse = on;
  refilter();
}

function refilter() {
  applyFilters();
  layout();
}

// Filtered nodes stay in the scene but hidden, so switching a filter off needs no new lookup.
function applyFilters() {
  const folded = [];
  const meta = cy.getElementById("external");
  const position = meta.nonempty() ? Object.assign({}, meta.position()) : null;
  cy.remove(".meta");
  for (const node of cy.nodes()) {
    const id = Number(node.id());
    const kind = node.data("kind");
    let hidden = false;
    if (kind === "Plt" && filters.hidePlt) {
      hidden = true;
    } else if (kind !== "Local" && filters.collapse) {
      hidden = true;
      folded.push(node);
    } else if (id !== seed && inDeg[id] + outDeg[id] < filters.minDegree) {
      hidden = true;
    } else if (id !== seed && filters.onlyExecuted && !(trace && trace.nodeHits.has(id))) {
      hidden = true;
    }
    node.toggleClass("hidden", hidden);
  }
  if (folded.length) {
    return fold(folded, position);
  }
  return cy.collection();
}

// Plt and unknown nodes are only ever callees, so every edge into the group points at the one node.
function fold(folded, position) {
  const meta = cy.add({
    group: "nodes",
    classes: "meta",
    data: {
      id: "external",
      label: "external (" + folded.length + ")",
      color: KINDS.Plt.color,
      shape: "rectangle",
    },
  });
  if (position) {
    meta.position(position);
  }
  const sources = new Set();
  for (const node of folded) {
    for (const edge of node.incomers("edge")) {
      if (!edge.source().hasClass("hidden")) {
        sources.add(edge.source().id());
      }
    }
  }
  for (const id of sources) {
    cy.add({
      group: "edges",
      classes: "meta",
      data: { id: id + "-external", source: id, target: "external" },
    });
  }
  return position ? cy.collection() : meta;
}

// A graph this small is cheaper to fetch whole than to walk one neighbourhood at a time.
function showAll() {
  api("/api/report").then((report) => {
    const all = nodes.map((_, id) => ({ id, hasMore: false }));
    merge({ nodes: all, edges: report.graph.edges, truncated: false });
    layout();
  });
}

function showSeed(index) {
  if (fullGraph) {
    select(index, true);
    return;
  }
  if (history[history.length - 1] !== index) {
    history.push(index);
  }
  openSeed(index);
}

function openSeed(index) {
  cy.elements().remove();
  seed = index;
  renderTrail();
  expand(index).then(() => {
    fit();
    highlight(index);
    renderPanel(index);
  });
}

function back() {
  if (history.length < 2) {
    return;
  }
  history.pop();
  openSeed(history[history.length - 1]);
}

function renderTrail() {
  const trail = document.getElementById("trail");
  trail.replaceChildren();
  history.forEach((index, at) => {
    if (at > 0) {
      trail.append(muted(">"));
    }
    if (at === history.length - 1) {
      trail.append(el("span", nodes[index].name));
      return;
    }
    const button = el("button", nodes[index].name);
    button.addEventListener("click", () => {
      history.splice(at + 1);
      openSeed(index);
    });
    trail.append(button);
  });
  document.getElementById("back").disabled = history.length < 2;
}

// Recentre only when the node was picked from the panel, where it may be off screen.
function select(index, center) {
  expand(index).then(() => {
    highlight(index);
    if (center) {
      cy.center(cy.getElementById(String(index)));
    }
    renderPanel(index);
  });
}

function expand(index) {
  return getNeighbors(index, 1, "both", BUDGET).then((result) => {
    const { added, skipped } = merge(result);
    const notes = [];
    if (result.truncated) {
      notes.push("neighbourhood of " + nodes[index].name + " cut at " + BUDGET + " nodes");
    }
    if (skipped) {
      notes.push("scene limit of " + SCENE_LIMIT + " nodes reached, " + skipped + " left out");
    }
    setStatus(notes.join("; "));
    if (added.length) {
      place(index, added.union(applyFilters()));
    }
  }).catch(() => setStatus("can't load neighbours of " + nodes[index].name));
}

// Only the new nodes get placed, one rank above or below the node they came from, so the rest
// of the scene stays where the user left it.
function place(index, added) {
  const anchor = cy.getElementById(String(index));
  const fresh = added.nodes().not(".hidden").not(anchor);
  const callees = fresh.filter((node) => anchor.edgesTo(node).nonempty());
  placeRank(anchor, callees, 1);
  placeRank(anchor, fresh.not(callees), -1);
}

function placeRank(anchor, row, direction) {
  if (row.empty()) {
    return;
  }
  const step = anchor.outerHeight() + DAGRE.rankSep;
  const lines = [];
  for (let at = 0; at < row.length; at += PER_LINE) {
    lines.push(row.slice(at, at + PER_LINE));
  }
  const width = Math.max(...lines.map(lineWidth));
  const top = anchor.position("y") + direction * step;
  const bottom = top + direction * step * (lines.length - 1);
  const others = cy.nodes().not(".hidden").not(row).filter((node) => {
    const y = node.position("y");
    return Math.min(top, bottom) - step / 2 < y && y < Math.max(top, bottom) + step / 2;
  });
  const left = freeSpan(anchor.position("x") - width / 2, width, others);
  lines.forEach((line, at) => {
    let x = left + (width - lineWidth(line)) / 2;
    for (const node of line) {
      node.position({ x: x + node.outerWidth() / 2, y: top + direction * step * at });
      x += node.outerWidth() + DAGRE.nodeSep;
    }
  });
}

function lineWidth(line) {
  return line.reduce((sum, node) => sum + node.outerWidth(), 0) + DAGRE.nodeSep * (line.length - 1);
}

// The block goes into the gap nearest to where it would be centred, so expansions stay compact.
function freeSpan(wanted, width, others) {
  const gap = DAGRE.nodeSep;
  const taken = others
    .map((node) => [node.boundingBox().x1 - gap, node.boundingBox().x2 + gap])
    .sort((a, b) => a[0] - b[0]);
  const spans = [];
  for (const [x1, x2] of taken) {
    const last = spans[spans.length - 1];
    if (last && x1 <= last[1]) {
      last[1] = Math.max(last[1], x2);
    } else {
      spans.push([x1, x2]);
    }
  }
  const options = [];
  let left = -Infinity;
  for (const [x1, x2] of spans) {
    if (x1 - left >= width) {
      options.push(Math.min(Math.max(wanted, left), x1 - width));
    }
    left = x2;
  }
  options.push(Math.max(wanted, left));
  return options.reduce((best, x) => (Math.abs(x - wanted) < Math.abs(best - wanted) ? x : best));
}

function getNeighbors(seed, depth, dir, budget) {
  const query = "id=" + seed + "&depth=" + depth + "&dir=" + dir + "&budget=" + budget;
  return api("/api/neighbors?" + query).then((result) => ({
    nodes: result.nodes.map((n) => ({ id: n.id, hasMore: n.has_more })),
    edges: result.edges,
    truncated: result.truncated,
  }));
}

function merge(result) {
  const fresh = [];
  const freshNodes = [];
  for (const { id, hasMore } of result.nodes) {
    const existing = cy.getElementById(String(id));
    if (existing.nonempty()) {
      // A node keeps its marker until one lookup has brought in all of its neighbours.
      if (!hasMore) {
        setMore(existing, false);
      }
      continue;
    }
    const node = nodes[id];
    const style = KINDS[node.kind] || KINDS.Unknown;
    fresh.push({ id, hasMore });
    freshNodes.push({
      group: "nodes",
      data: {
        id: String(id),
        name: node.name,
        kind: node.kind,
        color: style.color,
        shape: style.shape,
      },
    });
  }
  const room = Math.max(0, SCENE_LIMIT - cy.nodes().not(".meta").length);
  const skipped = Math.max(0, freshNodes.length - room);
  const added = cy.add(freshNodes.slice(0, room));
  for (const { id, hasMore } of fresh.slice(0, room)) {
    setMore(cy.getElementById(String(id)), hasMore);
  }

  const freshEdges = [];
  const seen = new Set();
  for (const [source, target] of result.edges) {
    const id = source + "-" + target;
    const ends = [cy.getElementById(String(source)), cy.getElementById(String(target))];
    if (ends.some((end) => end.empty())) {
      // The scene limit dropped one end, so the other one is where the rest can still be reached.
      ends.filter((end) => end.nonempty()).forEach((end) => setMore(end, true));
    } else if (cy.getElementById(id).empty() && !seen.has(id)) {
      seen.add(id);
      freshEdges.push({
        group: "edges",
        data: { id, source: String(source), target: String(target) },
      });
    }
  }
  const merged = added.union(cy.add(freshEdges));
  applyTrace(merged);
  return { added: merged, skipped };
}

function setMore(node, more) {
  node.data("more", more);
  relabel(node);
}

function relabel(node) {
  let label = node.data("name");
  if (node.data("hits") !== undefined) {
    label += " ×" + node.data("hits");
  }
  if (node.data("more")) {
    label += " +";
  }
  node.data("label", label);
}

// The trace stays in the page, so a node that arrives later still gets its mark and count.
function applyTrace(eles = cy.elements()) {
  const on = trace !== null && showTrace;
  for (const node of eles.nodes().not(".meta")) {
    setHits(node, on ? trace.nodeHits.get(Number(node.id())) : undefined);
    relabel(node);
  }
  for (const edge of eles.edges().not(".meta")) {
    setHits(edge, on ? trace.edgeHits.get(edge.id()) : undefined);
  }
}

function setHits(ele, hits) {
  if (hits === undefined) {
    ele.removeData("hits");
  } else {
    ele.data("hits", hits);
  }
  ele.toggleClass("executed", hits !== undefined);
}

function layout() {
  shown().layout(DAGRE).run();
  fit();
}

function highlight(index) {
  cy.nodes().removeClass("active");
  cy.getElementById(String(index)).addClass("active");
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function reset() {
  cy.nodes().removeClass("active");
  const hint = el("p", "click a node to expand it");
  hint.className = "hint";
  document.getElementById("node").replaceChildren(hint);
}

function renderPanel(index) {
  const node = nodes[index];
  // Plt and unknown nodes have no function entry, so their metrics are left out.
  const fn = functions.get(node.name);
  const rows = document.createElement("dl");
  addRow(rows, "kind", node.kind);
  if (fn) {
    addRow(rows, "address", "0x" + fn.address.toString(16));
    addRow(rows, "size", String(fn.size));
    addRow(rows, "instructions", String(fn.instructions));
  }
  addRow(rows, "in", String(inDeg[index]));
  addRow(rows, "out", String(outDeg[index]));
  if (trace && trace.nodeHits.has(index)) {
    addRow(rows, "hits", String(trace.nodeHits.get(index)));
  }

  const box = document.getElementById("node");
  box.replaceChildren(el("h2", node.name), rows);
  const scene = cy.getElementById(String(index));
  addList(box, "callers", sceneIds(scene.incomers("node")), (id) => select(id, true));
  addList(box, "callees", sceneIds(scene.outgoers("node")), (id) => select(id, true));
  box.scrollIntoView();
}

function sceneIds(collection) {
  return collection.not(".meta").map((n) => Number(n.id())).sort(byName);
}

function byName(a, b) {
  return nodes[a].name.localeCompare(nodes[b].name);
}

function addRow(rows, name, value) {
  rows.append(el("dt", name), el("dd", value));
}

function addList(box, title, indexes, pick) {
  if (indexes.length === 0) {
    return;
  }
  const list = el("ul");
  for (const index of indexes) {
    const button = el("button", nodes[index].name);
    button.addEventListener("click", () => pick(index));
    const item = el("li");
    item.append(button);
    list.append(item);
  }
  box.append(el("h3", title), list);
}

function el(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
</script>
</body>
</html>
