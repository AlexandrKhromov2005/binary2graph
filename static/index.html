<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>binary2graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: #222;
  }
  #header {
    flex: none;
    padding: 8px 12px;
    border-bottom: 1px solid #ccc;
    background: #f5f5f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #header .path {
    font-weight: 600;
  }
  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #cy {
    flex: 1;
    min-width: 0;
  }
  #panel {
    flex: none;
    width: 260px;
    padding: 10px 12px;
    border-left: 1px solid #ccc;
    background: #fafafa;
    overflow-y: auto;
  }
  #panel h2 {
    margin: 0 0 8px;
    font-size: 13px;
    font-family: monospace;
    word-break: break-all;
  }
  #panel h3 {
    margin: 12px 0 4px;
    font-size: 12px;
    color: #666;
  }
  #panel dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    margin: 0;
  }
  #panel dt {
    color: #666;
  }
  #panel dd {
    margin: 0;
    font-family: monospace;
  }
  #panel ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }
  #panel button {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    font-family: monospace;
    color: #0645ad;
    text-align: left;
    cursor: pointer;
  }
  #panel button:hover {
    text-decoration: underline;
  }
  #panel .hint {
    margin: 0;
    color: #666;
  }
</style>
</head>
<body>
<div id="header"></div>
<div id="main">
  <div id="cy"></div>
  <div id="panel"></div>
</div>
<script>
const KINDS = {
  Local: { color: "#a8d5ff", shape: "ellipse" },
  Plt: { color: "#ffcc99", shape: "rectangle" },
  Unknown: { color: "#dddddd", shape: "ellipse" },
};

let nodes = [];
let functions = new Map();
let callers = [];
let callees = [];
let inDeg = [];
let outDeg = [];
let cy = null;

fetch("/api/report")
  .then((r) => r.json())
  .then(init)
  .catch(() => {
    document.getElementById("header").textContent = "can't load report";
  });

function init(report) {
  nodes = report.graph.nodes;
  functions = new Map(report.functions.map((f) => [f.name, f]));
  indexEdges(report.graph.edges);
  renderHeader(report);
  renderGraph(report.graph);
  reset();
}

// In/out counts and caller/callee lists come from the edge list, not from the function metrics.
function indexEdges(edges) {
  inDeg = nodes.map(() => 0);
  outDeg = nodes.map(() => 0);
  callers = nodes.map(() => new Set());
  callees = nodes.map(() => new Set());
  for (const [source, target] of edges) {
    outDeg[source] += 1;
    inDeg[target] += 1;
    callees[source].add(target);
    callers[target].add(source);
  }
}

function renderHeader(report) {
  const info = report.info;
  const rest = [info.architecture, info.kind, info.stripped ? "stripped" : "not stripped"];
  const names = info.instrumentation.map((d) => d.name);
  if (names.length) {
    rest.push(names.join(", "));
  }
  const path = el("span", report.binary);
  path.className = "path";
  const header = document.getElementById("header");
  header.replaceChildren(path, document.createTextNode("  ·  " + rest.join("  ·  ")));
}

function renderGraph(graph) {
  const elements = {
    nodes: graph.nodes.map((n, i) => {
      const style = KINDS[n.kind] || KINDS.Unknown;
      return { data: { id: String(i), name: n.name, color: style.color, shape: style.shape } };
    }),
    edges: graph.edges.map(([source, target], i) => ({
      data: { id: "e" + i, source: String(source), target: String(target) },
    })),
  };

  cy = cytoscape({
    container: document.getElementById("cy"),
    elements: elements,
    layout: { name: "breadthfirst", directed: true, spacingFactor: 0.8, padding: 20 },
    style: [
      {
        selector: "node",
        style: {
          "label": "data(name)",
          "background-color": "data(color)",
          "shape": "data(shape)",
          "border-width": 1,
          "border-color": "#555",
          "width": "label",
          "height": "label",
          "padding": "8px",
          "font-size": 10,
          "font-family": "monospace",
          "text-valign": "center",
          "text-halign": "center",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1,
          "line-color": "#888",
          "target-arrow-color": "#888",
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.8,
          "curve-style": "bezier",
        },
      },
      { selector: ".active", style: { "border-width": 3, "border-color": "#333" } },
      { selector: ".dim", style: { "opacity": 0.15 } },
    ],
  });

  cy.on("tap", "node", (event) => select(Number(event.target.id()), false));
  cy.on("tap", (event) => {
    if (event.target === cy) {
      reset();
    }
  });
}

// Recentre only when the node was picked from the panel, where it may be off screen.
function select(index, center) {
  const node = cy.getElementById(String(index));
  cy.elements().removeClass("active dim");
  cy.elements().difference(node.closedNeighborhood()).addClass("dim");
  node.addClass("active");
  if (center) {
    cy.center(node);
  }
  renderPanel(index);
}

function reset() {
  cy.elements().removeClass("active dim");
  const hint = el("p", "click a node");
  hint.className = "hint";
  document.getElementById("panel").replaceChildren(hint);
}

function renderPanel(index) {
  const node = nodes[index];
  // Plt and unknown nodes have no function entry, so their metrics are left out.
  const fn = functions.get(node.name);
  const rows = document.createElement("dl");
  addRow(rows, "kind", node.kind);
  if (fn) {
    addRow(rows, "address", "0x" + fn.address.toString(16));
    addRow(rows, "size", String(fn.size));
    addRow(rows, "instructions", String(fn.instructions));
  }
  addRow(rows, "in", String(inDeg[index]));
  addRow(rows, "out", String(outDeg[index]));

  const panel = document.getElementById("panel");
  panel.replaceChildren(el("h2", node.name), rows);
  addList(panel, "callers", callers[index]);
  addList(panel, "callees", callees[index]);
  panel.scrollTop = 0;
}

function addRow(rows, name, value) {
  rows.append(el("dt", name), el("dd", value));
}

function addList(panel, title, indexes) {
  if (indexes.size === 0) {
    return;
  }
  const list = el("ul");
  const sorted = [...indexes].sort((a, b) => nodes[a].name.localeCompare(nodes[b].name));
  for (const index of sorted) {
    const button = el("button", nodes[index].name);
    button.addEventListener("click", () => select(index, true));
    const item = el("li");
    item.append(button);
    list.append(item);
  }
  panel.append(el("h3", title), list);
}

function el(tag, text) {
  const node = document.createElement(tag);
  node.textContent = text;
  return node;
}
</script>
</body>
</html>
