[package]
name = "binary2graph"
version = "0.11.0"
edition = "2024"

[dependencies]
object = "0.36"
iced-x86 = "1.21"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
nix = { version = "0.31", features = ["process", "ptrace", "signal"] }
base64 = "0.23"
